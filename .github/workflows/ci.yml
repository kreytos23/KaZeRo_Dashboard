name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: un deploy a medias es peor que esperar.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  KAZERO_COMMIT_SHA: ${{ github.sha }}

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm audit --prod --audit-level high

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integracion:
    # Se omite (no falla) en PRs desde forks y en PRs de Dependabot: ninguno recibe secretos de Actions
    # (repo público). El merge a main vuelve a ejecutar todo antes de producción. A Dependabot NO le damos
    # la API key de Neon a propósito: controla todo el proyecto Neon.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integracion
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          # Una rama Neon temporal por worker (se borran todas al terminar); baja sola si el plan no alcanza.
          KAZERO_TEST_WORKERS: '3'
      # Si la corrida se cancela, el proceso muere antes de borrar sus ramas de Neon: se borran aquí.
      - if: cancelled()
        run: pnpm exec tsx scripts/limpiar-ramas-ci.ts integracion
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

  build:
    needs: [calidad, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Versión exacta de @playwright/test para elegir la imagen de e2e: así una actualización de Playwright
      # (p. ej. de Dependabot) no deja la imagen con navegadores de otra versión.
      - id: pw
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache de build de Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # Se empaqueta con tar para conservar los symlinks de .next/node_modules (paquetes externos
      # como sharp apuntan al store de pnpm); upload-artifact los copiaría sin sus dependencias.
      - run: tar -cf next-build.tar --exclude=.next/cache .next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tar
          retention-days: 1

  e2e:
    # No espera a integracion: corren en paralelo y el despliegue exige ambas.
    needs: [build]
    # Mismo guarda que integracion (sin secretos en forks ni Dependabot).
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # Imagen oficial de Playwright con Chromium y sus dependencias del sistema ya instaladas: instalar las
    # dependencias con apt en cada corrida costaba ~5 min. La versión sale de package.json (job build).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: { name: next-build }
      - run: tar -xf next-build.tar && rm next-build.tar
      - run: pnpm test:e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      # Si la corrida se cancela, el proceso muere antes de borrar sus ramas de Neon: se borran aquí.
      - if: cancelled()
        run: pnpm exec tsx scripts/limpiar-ramas-ci.ts e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  deploy-preview:
    needs: [e2e, integracion]
    # Depende de e2e, que se omite en forks y Dependabot; se repite el guarda por claridad.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vercel pull --yes --environment=preview
      - run: pnpm exec vercel build --target=preview
      - name: Migrar rama development tras el build (la usan los previews; un build roto no migra)
        run: pnpm db:migrar
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          # La guarda se niega si DATABASE_URL_OWNER apunta a producción por error.
          KAZERO_HOST_PROD: ${{ vars.KAZERO_HOST_PROD }}
      - id: deploy
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --target=preview)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verificar que el deploy quedó en preview (falla si no)
        run: |
          # API REST (no el CLI: `vercel inspect --format=json` no imprime en stdout en CI).
          # curl -f y jq fallan cerrado; en la API un deploy de preview tiene target null.
          host="${DEPLOY_URL#https://}"
          resp="$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}")"
          [ "$(jq -r '.url' <<<"$resp")" = "$host" ] || { echo "::error::La API no devolvió el deployment ${host}."; exit 1; }
          target="$(jq -r '.target // "preview"' <<<"$resp")"
          if [ "$target" != "preview" ]; then
            echo "::error::El deploy de preview quedó con target=${target:-desconocido}; se aborta para no publicar un PR en producción."
            exit 1
          fi
          echo "Target verificado: $target"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
      - run: pnpm smoke "$DEPLOY_URL"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `Preview listo (smoke OK): ${process.env.DEPLOY_URL}\nCommit: ${context.payload.pull_request.head.sha.slice(0, 7)}`,
            });

  deploy-produccion:
    needs: [e2e, integracion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # El environment "production" exige aprobación manual antes de tocar la BD y el dominio.
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vercel pull --yes --environment=production
      - run: pnpm exec vercel build --prod
      - name: Migrar producción tras el build (un build roto no migra; con guarda y confirmación explícita)
        run: pnpm db:migrar
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          KAZERO_HOST_PROD: ${{ vars.KAZERO_HOST_PROD }}
          KAZERO_OTRA_BD: confirmo
      - name: Deploy sin asignar dominio (staged)
        id: deploy
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --prod --skip-domain)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verificar que el deploy quedó en production (falla si no)
        run: |
          # API REST (no el CLI: `vercel inspect --format=json` no imprime en stdout en CI).
          # curl -f y jq fallan cerrado; en la API un deploy de preview tiene target null.
          host="${DEPLOY_URL#https://}"
          resp="$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}")"
          [ "$(jq -r '.url' <<<"$resp")" = "$host" ] || { echo "::error::La API no devolvió el deployment ${host}."; exit 1; }
          target="$(jq -r '.target // "preview"' <<<"$resp")"
          if [ "$target" != "production" ]; then
            echo "::error::El deploy de producción quedó con target=${target:-desconocido}; se aborta sin promover."
            exit 1
          fi
          echo "Target verificado: $target"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
      - name: Smoke contra el deployment antes de recibir tráfico
        run: pnpm smoke "$DEPLOY_URL"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Promover exactamente ese deployment (sin rebuild)
        # API REST: `vercel promote` con token de equipo responde "User not found (404)" en CI.
        # Se promueve por id y se espera a que el dominio apunte a ese mismo deployment.
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          host="${DEPLOY_URL#https://}"
          id="$(curl -fsS -H "$auth" "${api}/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}" | jq -r '.id')"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::No se obtuvo el id de ${host}."; exit 1; }
          curl -fsS -X POST -H "$auth" "${api}/v10/projects/${VERCEL_PROJECT_ID}/promote/${id}?teamId=${VERCEL_ORG_ID}" > /dev/null
          for _ in $(seq 1 30); do
            actual="$(curl -fsS -H "$auth" "${api}/v13/deployments/${DOMINIO_PROD}?teamId=${VERCEL_ORG_ID}" | jq -r '.id')"
            if [ "$actual" = "$id" ]; then echo "El dominio ${DOMINIO_PROD} apunta a ${id}."; exit 0; fi
            sleep 5
          done
          echo "::error::El dominio ${DOMINIO_PROD} no apuntó al deployment ${id} en 150 s."
          exit 1
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DOMINIO_PROD: kazero-dashboard.vercel.app
      - name: Smoke contra el dominio de producción
        run: pnpm smoke https://kazero-dashboard.vercel.app
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
